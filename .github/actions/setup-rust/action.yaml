name: Setup Rust
description: Install the Rust toolchain from rust-toolchain.toml and the tools in mise.toml, and configure caching

inputs:
  target:
    description: Additional Rust target to install
    required: false
    default: ''
  cache-key:
    description: Extra key for Swatinem/rust-cache
    required: false
    default: ''
  cache:
    description: >
      Whether to restore and save caches. Release runs pass false: their jobs
      run a PR's code with the base branch's cache scope, and nothing a release
      is built from should come from a cache another PR could have written.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      with:
        version: 2026.9.15
        cache: ${{ inputs.cache }}

    - name: Install Rust
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: |
        rustup toolchain install
        if [ -n "$TARGET" ]; then
          rustup target add "$TARGET"
        fi

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      if: inputs.cache == 'true'
      with:
        key: ${{ inputs.cache-key }}
