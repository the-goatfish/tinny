name: Release-plz

on:
  push:
    branches:
      - crate-testing

jobs:
  # Only requests the approval-gated release job when there's actually a
  # version to release (i.e. right after a release PR merge bumps
  # Cargo.toml) — otherwise an ordinary doc-fix commit to main would pause
  # CI asking a human to approve a no-op, which is just approval-fatigue
  # for zero benefit. A skipped job never reaches the environment gate, so
  # reviewers are only ever notified when there's a real release pending.
  check-pending-release:
    name: Check for pending release
    runs-on: ubuntu-latest
    outputs:
      pending: ${{ steps.check.outputs.pending }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check if current Cargo.toml version is already tagged
        id: check
        run: |
          VERSION="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "pending=false" >> "$GITHUB_OUTPUT"
          else
            echo "pending=true" >> "$GITHUB_OUTPUT"
          fi

  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    needs: check-pending-release
    if: needs.check-pending-release.outputs.pending == 'true'
    environment: crates-io-publish-testing
    permissions:
      contents: write      # push tags, create releases
      pull-requests: read  # detect the release PR and its commits
      id-token: write      # crates.io trusted publishing (OIDC) — no CARGO_REGISTRY_TOKEN needed
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Run release-plz release
        uses: release-plz/action@v0.5.144
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    permissions:
      contents: write       # push to the PR branch
      pull-requests: write  # create/update the PR
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Run release-plz release-pr
        uses: release-plz/action@v0.5.144
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
