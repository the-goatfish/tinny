name: Release

# Merges and releases a pull request. Start it from the Actions tab: "Run
# workflow", choosing the PR's base branch under "Use workflow from", and give
# the PR number. It:
#
# 1. rebases the PR onto its base, bumps the version, writes the changelog and
#    tags (scripts/prepare-release.sh, using the PR's own Cargo.lock);
# 2. re-runs every check and release build on that commit (build.yaml);
# 3. fast-forwards the base branch and pushes the tag; drafts the GitHub
#    Release; publishes to crates.io; then publishes the GitHub Release.
#
# Nothing here trusts the PR's own build runs: step 2 runs everything again
# from scratch, and this workflow, build.yaml and every action they use come
# from the base branch (`uses: $/...` loads them from the workflow's own
# commit, whatever is checked out). The PR's code does run in step 2, but with
# read-only access, no secrets and no caches. Only the publish job can use the
# `release` environment's secrets, and it never builds or runs the PR's code,
# nor lets config from the PR's tree steer a tool. See DEVELOPMENT.md.

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        type: number
        required: true

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve pull request
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read  # check the PR is ready, and find its head and base
    outputs:
      head-sha: ${{ steps.pr.outputs.head-sha }}
      head-ref: ${{ steps.pr.outputs.head-ref }}
      base-ref: ${{ steps.pr.outputs.base-ref }}
    steps:
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
        run: |
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR")
          field() { jq -r "$1" <<<"$pr"; }
          fail() { echo "::error::$1"; exit 1; }

          [ "$(field .state)" = open ] || fail "#$PR isn't open"
          [ "$(field .draft)" = false ] || fail "#$PR is a draft"
          [ "$(field .head.repo.full_name)" = "$GITHUB_REPOSITORY" ] ||
            fail "#$PR is from a fork: push its branch to this repository and open a new PR"
          base=$(field .base.ref)
          # So that this workflow and everything it calls come from the base.
          if [ "$GITHUB_REF_TYPE" != branch ] || [ "$GITHUB_REF_NAME" != "$base" ]; then
            fail "#$PR targets $base: run this workflow from $base (\"Use workflow from\"), not $GITHUB_REF_NAME"
          fi

          {
            echo "head-sha=$(field .head.sha)"
            echo "head-ref=$(field .head.ref)"
            echo "base-ref=$base"
          } >>"$GITHUB_OUTPUT"

  verify:
    name: Verify
    needs: resolve
    permissions:
      contents: read
    uses: $/.github/workflows/build.yaml
    with:
      head-sha: ${{ needs.resolve.outputs.head-sha }}
      base-ref: ${{ needs.resolve.outputs.base-ref }}

  # Every step either does nothing if it already succeeded, or can't have
  # partly succeeded, so if this job fails, fix the cause and re-run it.
  publish:
    name: Publish
    needs: [resolve, verify]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write      # draft and publish the GitHub Release
      id-token: write      # crates.io trusted publishing; build provenance
      attestations: write  # build provenance
    env:
      GH_REPO: ${{ github.repository }}
      PR: ${{ inputs.pr }}
      HEAD_SHA: ${{ needs.resolve.outputs.head-sha }}
      HEAD_REF: ${{ needs.resolve.outputs.head-ref }}
      BASE_REF: ${{ needs.resolve.outputs.base-ref }}
      VERSION: ${{ needs.verify.outputs.version }}
      TAG: v${{ needs.verify.outputs.version }}
    steps:
      # The base branch, for its rust-toolchain.toml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The PR could point rust-toolchain.toml at any binary, so cargo here
      # always uses the base's toolchain.
      - name: Install the base branch's Rust toolchain
        id: toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal
          echo "channel=$channel" >>"$GITHUB_OUTPUT"

      - uses: $/.github/actions/checkout-prepared
        id: prepared

      - name: Check there's a release to publish
        env:
          RELEASED: ${{ steps.prepared.outputs.released }}
        run: |
          [ "$RELEASED" = true ] || { echo "::error::#$PR adds nothing to release"; exit 1; }
          # Cargo config in the tree could change how cargo publish
          # authenticates, or where it sends the token.
          if [ -e .cargo/config ] || [ -e .cargo/config.toml ]; then
            echo "::error::Refusing to run cargo publish with the repository's .cargo/config.toml; see DEVELOPMENT.md"
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          path: ${{ runner.temp }}/dist
          merge-multiple: true

      - name: Verify checksums
        working-directory: ${{ runner.temp }}/dist
        run: |
          shasum -a 256 -c ./*.sha256
          cat ./*.sha256 >SHA256SUMS

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # Only ever a fast-forward: if the base moved since prepare, this fails
      # and nothing has been released. Run the workflow again.
      - name: Push to the base branch, with the tag
        env:
          TOKEN: ${{ steps.app.outputs.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git() { command git -c "http.https://github.com/.extraheader=$auth" "$@"; }
          git fetch --quiet origin "refs/heads/$BASE_REF"
          if git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "$BASE_REF already has $TAG"
          else
            git push --atomic origin "HEAD:refs/heads/$BASE_REF" "refs/tags/$TAG"
          fi

      # GitHub marks a PR merged once its head commit is on the base branch.
      # If the branch has moved on since, close the PR instead.
      - name: Mark the pull request merged
        env:
          TOKEN: ${{ steps.app.outputs.token }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git() { command git -c "http.https://github.com/.extraheader=$auth" "$@"; }
          if [ "$(git ls-remote origin "refs/heads/$HEAD_REF" | cut -f1)" != "$(git rev-parse HEAD)" ]; then
            git push --force-with-lease="refs/heads/$HEAD_REF:$HEAD_SHA" origin "HEAD:refs/heads/$HEAD_REF" ||
              echo "::warning::$HEAD_REF has moved on since the release started; closing #$PR instead"
          fi
          for _ in 1 2 3 4 5 6; do
            [ "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .merged)" = true ] && exit 0
            sleep 5
          done
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .state)" = open ]; then
            gh pr close "$PR" --comment "Released in $TAG ($(git rev-parse HEAD))."
          fi

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/dist/*.tar.gz

      - name: Draft the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ runner.temp }}/prepared/release-notes.md
        working-directory: ${{ runner.temp }}/dist
        run: |
          if ! draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            prerelease=()
            [[ $VERSION == *-* ]] && prerelease=(--prerelease)
            gh release create "$TAG" --draft --verify-tag "${prerelease[@]}" \
              --title "$TAG" --notes-file "$NOTES" ./*.tar.gz ./*.sha256 SHA256SUMS
          elif [ "$draft" = true ]; then
            gh release upload "$TAG" --clobber ./*.tar.gz ./*.sha256 SHA256SUMS
          else
            echo "$TAG is already published"
          fi

      - name: Check whether crates.io has this version
        id: crate
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.toolchain.outputs.channel }}
        run: |
          name=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].name')
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -A "tinny-release (https://github.com/$GITHUB_REPOSITORY)" \
            "https://crates.io/api/v1/crates/$name/$VERSION")
          case "$status" in
            200) echo "published=true" >>"$GITHUB_OUTPUT" ;;
            404) echo "published=false" >>"$GITHUB_OUTPUT" ;;
            *) echo "::error::Unexpected HTTP $status from crates.io"; exit 1 ;;
          esac

      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: crates-io
        if: steps.crate.outputs.published == 'false'

      # --no-verify: verify's publish-dry-run already built this commit, and
      # building here would run the PR's build.rs alongside the token.
      - name: Publish to crates.io
        if: steps.crate.outputs.published == 'false'
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.toolchain.outputs.channel }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io.outputs.token }}
        run: cargo publish --locked --no-verify

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true ]; then
            gh release edit "$TAG" --draft=false
          else
            echo "$TAG is already published"
          fi
