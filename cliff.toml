# git-cliff configuration file
# https://git-cliff.org/docs/configuration

[bump]
features_always_bump_minor = false
breaking_always_bump_major = false

[remote.github]
# Needed for the plain `git-cliff` CLI (e.g. build.rs's subprocess call, or
# running `git-cliff` by hand), which expects `remote.github.owner`/`repo`.
# Without this, rendering fails outright ("Variable `remote.github.owner`
# not found"). `token` is intentionally omitted; it's picked up from the
# GITHUB_TOKEN environment variable when running in CI.
#
# release-plz's EMBEDDED git-cliff (via changelog_config below) is a
# different consumer of this same template and exposes a different,
# unnamespaced shape instead: `remote.owner`/`remote.repo` (no `.github`).
# The templates below branch on `remote.github is defined` to support both
# shapes from the one file — confirmed by testing against both directly;
# neither consumer's shape is a superset of the other's.
owner = "the-goatfish"
repo = "tinny"

[changelog]
# template for the changelog header
header = """
# Changelog\n
All notable changes to this project will be documented in this file.\n
"""
# template for the changelog body
# https://keats.github.io/tera/docs/#introduction
body = """
{%- macro category(title, cat_commits, gh_owner, gh_repo) -%}
    {%- if cat_commits | length > 0 %}

### {{ title }}
        {%- set_global scoped_commits = [] -%}
        {%- set_global unscoped_commits = [] -%}
        {%- for commit in cat_commits -%}
            {%- if commit.scope and commit.scope not in scoped_commits -%}
                {%- set_global scoped_commits = scoped_commits | concat(with=[commit.scope]) -%}
            {%- endif -%}
            {%- if not commit.scope -%}
                {%- set_global unscoped_commits = unscoped_commits | concat(with=[commit]) -%}
            {%- endif -%}
        {%- endfor -%}
        {%- for scope in scoped_commits %}
- *({{ scope }})*
            {%- set scope_group = cat_commits | filter(attribute="scope", value=scope) -%}
            {%- for commit in scope_group %}
{{ "  " }}- {% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message | split(pat="\n") | first | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/{{ gh_owner }}/{{ gh_repo }}/commit/{{ commit.id }}))
            {%- endfor -%}
        {%- endfor -%}
        {%- for commit in unscoped_commits %}
- {% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message | split(pat="\n") | first | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/{{ gh_owner }}/{{ gh_repo }}/commit/{{ commit.id }}))
        {%- endfor -%}
    {%- endif -%}
{%- endmacro category -%}
{%- if remote.github is defined -%}
    {%- set gh_owner = remote.github.owner -%}
    {%- set gh_repo = remote.github.repo -%}
{%- else -%}
    {%- set gh_owner = remote.owner -%}
    {%- set gh_repo = remote.repo -%}
{%- endif -%}
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{%- endif %}\
{%- set breaking_commits = commits | filter(attribute="group", value="Breaking Changes") -%}
{%- set feat_commits = commits | filter(attribute="group", value="Features") -%}
{%- set fix_commits = commits | filter(attribute="group", value="Bug Fixes") -%}
{%- set functional_commits = feat_commits | concat(with=fix_commits) -%}
{%- set perf_commits = commits | filter(attribute="group", value="Performance") -%}
{%- set refactor_commits = commits | filter(attribute="group", value="Refactor") -%}
{%- set build_commits = commits | filter(attribute="group", value="Build") -%}
{%- set behavioural_commits = perf_commits | concat(with=refactor_commits) | concat(with=build_commits) -%}
{%- set doc_commits = commits | filter(attribute="group", value="Documentation") -%}
{%- set chore_commits = commits | filter(attribute="group", value="Miscellaneous Tasks") -%}
{%- set test_commits = commits | filter(attribute="group", value="Testing") -%}
{%- set ci_commits = commits | filter(attribute="group", value="Continuous Integration") -%}
{%- set style_commits = commits | filter(attribute="group", value="Styling") -%}
{%- set chore_group_commits = chore_commits | concat(with=test_commits) | concat(with=ci_commits) | concat(with=style_commits) -%}
{{- self::category(title="Breaking Changes", cat_commits=breaking_commits, gh_owner=gh_owner, gh_repo=gh_repo) -}}
{{- self::category(title="Functional", cat_commits=functional_commits, gh_owner=gh_owner, gh_repo=gh_repo) -}}
{{- self::category(title="Behavioural", cat_commits=behavioural_commits, gh_owner=gh_owner, gh_repo=gh_repo) -}}
{{- self::category(title="Documentation", cat_commits=doc_commits, gh_owner=gh_owner, gh_repo=gh_repo) -}}
{{- self::category(title="Chore", cat_commits=chore_group_commits, gh_owner=gh_owner, gh_repo=gh_repo) -}}
"""
# template for the changelog footer
footer = """
"""
# remove the leading and trailing sitemaps
trim = true

[git]
# parse the commits that do not conform to the conventional commits spec
filter_unconventional = false
# process each line of a commit as an individual commit
split_commits = false
# regex for preprocessing the commit messages
commit_preprocessors = [
    # Replace issue numbers
    { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}]({% if remote.github is defined %}https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}{% else %}https://github.com/{{ remote.owner }}/{{ remote.repo }}{% endif %}/issues/${2}))" },
]
# regex for parsing and grouping commits
commit_parsers = [
    { field = "breaking", pattern = "true", group = "Breaking Changes" },
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactor" },
    { message = "^build", group = "Build" },
    { message = "^doc", group = "Documentation" },
    { message = "^chore", group = "Miscellaneous Tasks" },
    { message = "^test", group = "Testing" },
    { message = "^ci", group = "Continuous Integration" },
    { message = "^style", group = "Styling" },
]
# protect breaking changes from being skipped due to matching a group
protect_breaking_commits = true
# fail when any commit is not matched by any of the commit_parsers
fail_on_unmatched_commit = true
# glob pattern for matching git tags
tag_pattern = "v[0-9]*"
# regex for skipping tags
skip_tags = "beta"
# regex for ignoring tags
ignore_tags = ""
# sort the tags topologically
topo_order = false
# sort the commits inside sections by oldest/newest
sort_commits = "oldest"
